<html>
    <head>
        <title>Kinza's Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link href="assets/reset.css" rel="stylesheet">
        <link href="assets/style.css" rel="stylesheet">
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Special+Elite&display=swap');
        </style>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Turret+Road:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">
        <script defer src="assets/arena.js"></script>
        <script defer src="assets/script.js"></script>

    </head>
    
    <body>

            <svg id="connection-lines"></svg>

            <div id="controls">
                <button id="show-all">Untangle</button>
                <button id="show-images">Image</button>
                <button id="show-text">Text</button>
                <button id="show-links">Link</button>
                <button id="show-audio">Audio</button>
                <button id="show-videos">Video</button>
                <button id="show-tangled">Tangle</button>
            </div>
            
        <header>
            <h1 id="title"></h1>

                <ul>
                    <li id="channel-description"></li>
                    <li id="channel-count"></li>
                    <li id="last-updated"></li>
                    <li id="channel-users"></li>
                </ul>
            </header>

        <section>
            <ul id="channel-blocks"></ul>
        </section>

           <dialog id="channel-dialog">
                <div class="dialog-content">
        
                        <ul class="dialog-grid">

                            <li class="row-header">
                                 <button id="dialog-close-btn" class="close-x-btn">✕</button>
                                <h2 id="dialog-type" class="dialog-title-text"></h2>
                            </li>

                            <li class="row-media" id="dialog-media-container">
                                <img id="dialog-img" src="" alt="">
                                <div id="dialog-embed"></div>
                            </li>

                            <li class="row-desc">
                                <div id="dialog-title"></div>
                            </li>

                            <li class="row-link">
                                <a id="dialog-arena-link" class="action-btn" href="" target="_blank">Source Knot</a>
                                <br><br>
                                <a id="dialog-download-link" href="" target="_blank" style="display:none;">Download File ↘</a>
                            </li>
                        
                        </ul>
                </div>
            </dialog>

            <dialog id="head-dialog">
                <div class="head-content">
        
                        <ul class="head-grid">

                            <li class="header-header">
                                 <button id="dialog-close-btn" class="close-x-btn">✕</button>
                                <h2 class="head-title-text"></h2>
                            </li>

                            <li class="head-desc">
                            </li>

                            <li class="head-count">
                            </li>

                            <li class="head-last-updated">
                            </li>

                            <li class="head-users">
                            </li>
                        
                        </ul>
                </div>
            </dialog>
    </body>
</html>
